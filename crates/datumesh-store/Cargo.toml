[package]
name = "datumesh-store"
version = "0.2.0"
description = "PostgreSQL store for Datumesh: descriptors, receipts, blobs, versions over transaction time, lineage, namespaces and names; a datumesh-core Resolver."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/datumesh-store"
readme = "../../README.md"
keywords = ["datumesh", "receipt", "postgres", "store", "provenance"]
categories = ["database"]
include = ["src/**/*.rs", "migrations/*.sql", "Cargo.toml", "LICENSE"]

[dependencies]
datumesh-core.workspace = true
postgres.workspace = true
rustls.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
datumesh-core = { workspace = true, features = ["testkit", "sign"] }
