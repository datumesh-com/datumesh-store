[package]
name = "datumesh-store"
version = "0.3.2"
description = "Store for Datumesh on PostgreSQL or SQLite: descriptors, receipts, blobs, versions over transaction time, lineage, namespaces and names; a datumesh-core Resolver."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/datumesh-store"
readme = "../../README.md"
keywords = ["datumesh", "receipt", "postgres", "sqlite", "provenance"]
categories = ["database"]
include = ["src/**/*.rs", "migrations/*.sql", "migrations/sqlite/*.sql", "Cargo.toml", "LICENSE"]

[dependencies]
datumesh-core.workspace = true
postgres.workspace = true
rusqlite = { workspace = true, optional = true }
rustls.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[features]
default = ["sqlite"]
# The SQLite backend (SqliteStore, migrate::sqlite): SQLite compiled in from source (a C
# compiler at build time, no system library).
sqlite = ["dep:rusqlite"]

[dev-dependencies]
datumesh-core = { workspace = true, features = ["testkit", "sign"] }
rusqlite.workspace = true
