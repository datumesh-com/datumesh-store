[workspace]
resolver = "2"
members = ["crates/datumesh-store", "crates/datumesh-store-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/datumesh-com/datumesh-store"
homepage = "https://datumesh.com"

[workspace.dependencies]
datumesh-core = "0.3.1"
postgres = "0.19.14"
tracing = "0.1.44"
# TLS for PostgreSQL connections: rustls with the ring provider (selected explicitly per
# connector, never installed process-wide), the Mozilla roots, and the bridge to the driver.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false }
webpki-roots = "1.0.10"

# curve25519 and sha2 are optimised even in test builds: the tests and the benchmark
# generator sign many receipts.
[profile.dev.package."*"]
opt-level = 3
